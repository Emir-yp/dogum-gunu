<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İyi Ki Doğdun Ablacım!</title>
    <link rel="stylesheet" href="style.css">
    <!-- Konfeti Efekti İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <div class="card">
        <h1 class="title">🎉 İyi Ki Doğdun Ablacım! 🎂</h1>
        <p class="subtitle">Dünyanın en harika ablasına özel...</p>

        <!-- Abla Fotoğrafı (Aynı klasöre abla.jpg adında bir fotoğraf koyabilirsin) -->
        <div class="img-box">
            <img src="abla.jpg" alt="Ablam" id="profile-img">
        </div>

        <p class="message" id="secret-message">
            Yeni yaşında sağlık, mutluluk ve tüm dileklerinin gerçekleşmesini diliyorum. 
            İyi ki varsın, iyi ki benim ablamıssın! ❤️
        </p>

        <button id="surprise-btn" onclick="patlatSurprizi()">Sürprizi Gör! 🎁</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
